name: Build Zeabur Web Image

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zeabur-web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: github.repository == 'Sami-Ke/OmniRoute'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Sign in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push browser-enabled OmniRoute
        uses: docker/build-push-action@v7
        with:
          context: .
          target: runner-web
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/sami-ke/omniroute:web-observability
            ghcr.io/sami-ke/omniroute:web-observability-${{ github.sha }}
          cache-from: type=gha,scope=zeabur-web-amd64
          cache-to: type=gha,scope=zeabur-web-amd64,mode=max
